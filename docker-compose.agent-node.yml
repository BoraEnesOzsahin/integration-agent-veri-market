# =============================================================================
# Ayrotek Veri Marketi — Bağımsız Kurum İçi DMZ Düğümü (On-Premise Node Stack)
#
# Linux'ta bilgisayarın kendi ağıyla (network_mode: host) çalışır:
#   - Ajan, makinede kurulu Postgres'e localhost üzerinden bağlanır (Postgres ayarı değişmez).
#   - MP-SPDZ tarafları diğer kurumlarla doğrudan konuşur.
#
# Servisler:
#   1. zkp-postgres : Yalnızca ZKP motorunun kendi verisi (kurum verisinden ayrı, port 5441)
#   2. zkp-anoncreds: Kurum içi Hyperledger AnonCreds ZKP motoru
#   3. mp-spdz      : Kurumun kendi MP-SPDZ tarafı (köprüsü yalnızca 127.0.0.1'i dinler)
#   4. manager      : Koordinatör ile kayıt ve canlılık yöneten Sidecar
#   5. agent        : DB sorguları, ZKP ve MPC yönetimi
#   postgres        : Makinede Postgres yoksa: docker compose --profile local-db up -d
#
# Açık olması gereken portlar: 8083, 8093 ve MP-SPDZ için 14000-14999 (TCP).
# İmajlar bu depodan derlenir (--build). İlk build birkaç dakika sürer ve internet gerektirir.
# =============================================================================

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: agent-node-postgres
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-p", "${DB_PORT:-5432}"]
    environment:
      POSTGRES_DB: ${DB_NAME:-institution_db}
      POSTGRES_USER: ${DB_USER:-verimarket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
    volumes:
      - ./init-agent-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - agent_postgres_data:/var/lib/postgresql/data

  zkp-postgres:
    image: postgres:16-alpine
    container_name: agent-node-zkp-postgres
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-p", "5441", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: zkp_db
      POSTGRES_USER: zkp
      POSTGRES_PASSWORD: ${ZKP_DB_PASSWORD:-zkp_local_only}
    volumes:
      - agent_zkp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5441 -U zkp -d zkp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  zkp-anoncreds:
    build:
      context: ./zkp_anoncreds
    image: verimarket-zkp-anoncreds:latest
    container_name: agent-node-zkp
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://zkp:${ZKP_DB_PASSWORD:-zkp_local_only}@127.0.0.1:5441/zkp_db
    depends_on:
      zkp-postgres:
        condition: service_healthy

  mp-spdz:
    build:
      context: ./mpc_engine
    image: verimarket-mp-spdz:latest
    container_name: agent-node-mp-spdz
    restart: unless-stopped
    network_mode: host
    environment:
      MP_SPDZ_BIND: 127.0.0.1
      MP_SPDZ_PORT: 50051

  manager:
    build:
      context: .
      dockerfile: manager_service/Dockerfile
    image: verimarket-manager:latest
    container_name: agent-node-manager
    restart: unless-stopped
    network_mode: host
    environment:
      - SERVER_PORT=8093
      - NODE_ID=${NODE_ID:?NODE_ID gerekli}
      - NODE_NAME=${NODE_NAME:-Harici Kurum DMZ Düğümü}
      - AGENT_PUBLIC_URL=http://${MY_IP:?MY_IP gerekli}:8083
      - MANAGER_PUBLIC_URL=http://${MY_IP:?MY_IP gerekli}:8093
      - SUPPORTED_DATASETS=${SUPPORTED_DATASETS:-gelir_gider,bankalar,finans,kredi,consortium}
      - ANONCREDS_SERVICE_URL=http://127.0.0.1:3000
      - COORDINATOR_URL=${COORDINATOR_URL:?COORDINATOR_URL gerekli}
      - HEARTBEAT_ENABLED=true
      - HEARTBEAT_INTERVAL_MS=10000
    depends_on:
      zkp-anoncreds:
        condition: service_started

  agent:
    build:
      context: .
      dockerfile: agent_core/Dockerfile
    image: verimarket-agent:latest
    container_name: agent-node-core
    restart: unless-stopped
    network_mode: host
    environment:
      - SERVER_PORT=8083
      - AGENT_ID=${NODE_ID:?NODE_ID gerekli}
      - AGENT_NAME=${NODE_NAME:-Harici Kurum DMZ Düğümü}
      - AGENT_PUBLIC_URL=http://${MY_IP:?MY_IP gerekli}:8083
      - COORDINATOR_URL=${COORDINATOR_URL:?COORDINATOR_URL gerekli}
      - ANONCREDS_SERVICE_URL=http://127.0.0.1:3000
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}/${DB_NAME:-institution_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-verimarket}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD gerekli}
      - AGENT_DB_URL=jdbc:postgresql://${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}/${DB_NAME:-institution_db}
      - AGENT_DB_USERNAME=${DB_USER:-verimarket}
      - AGENT_DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD gerekli}
      - AGENT_MPC_ENGINE_URL=http://127.0.0.1:50051
      - AGENT_COORDINATOR_PUBLIC_KEY=${AGENT_COORDINATOR_PUBLIC_KEY:?Koordinatörün /api/v1/vc/platform-public-key değeri gerekli}
      - AGENT_SIGNING_KEY_FILE=/data/agent-signing.key
      # Kurum yalnızca burada kayıtlı tüketicilerin imzaladığı sorguları çalıştırır: kimlik:anahtarHex,kimlik:anahtarHex
      - AGENT_REQUIRE_CONSUMER_AUTH=${AGENT_REQUIRE_CONSUMER_AUTH:-true}
      - AGENT_TRUSTED_CONSUMERS=${AGENT_TRUSTED_CONSUMERS:-}
    volumes:
      - agent_keys:/data
    depends_on:
      - zkp-anoncreds
      - manager
      - mp-spdz

volumes:
  agent_postgres_data:
  agent_zkp_data:
  agent_keys:
