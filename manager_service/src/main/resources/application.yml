server:
  port: ${SERVER_PORT:8093}
  # Koordinatör yöneticiye bağlanmaz; kayıt ve nabız makineden dışarı gider. Bu yüzden dışarıya açılmaz.
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: manager-service

node:
  id: ${NODE_ID}
  name: ${NODE_NAME}
  agent-url: ${AGENT_PUBLIC_URL:http://localhost:8083}
  # Eski sürümlerle uyum için kayıtta boş gönderilir
  manager-url: ${MANAGER_PUBLIC_URL:}
  # Ajanın paylaşım listesi: koordinatöre bildirilen tablolar buradan okunur
  exposure-policy-file: ${NODE_EXPOSURE_POLICY_FILE:}
  anoncreds-url: ${ANONCREDS_SERVICE_URL:http://localhost:3000}
  coordinator-url: ${COORDINATOR_URL:http://localhost:8081}
  # Ajanın imza anahtarıyla aynı dosya: kurumun tek kimliği
  signing-key-file: ${NODE_SIGNING_KEY_FILE:}
  heartbeat:
    enabled: ${HEARTBEAT_ENABLED:true}
    interval-ms: ${HEARTBEAT_INTERVAL_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
